# Synthetic fixture -- NOT a real Studio export and not paste-tested.
# It exists so scripts/app_inventory.py has a 10-screen app to summarise in CI.
# Shapes are copied from the bundled examples; values are invented.
Screens:
  scrMyProfile:
    Properties:
      Fill: =RGBA(244, 244, 246, 1)
    Children:
      - grpHeaderProf:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            X: =24
            Y: =24
            Width: =320
            Height: =48
            Fill: =RGBA(255, 255, 255, 1)
            BorderThickness: =1
          Children:
            - lblTitleProf:
                Control: Label@2.5.1
                Properties:
                  X: =24
                  Y: =24
                  Width: =320
                  Height: =48
                  Text: ="lblTitleProf"
                  Color: =varThemeText
                  Size: =14
            - lblSubProf:
                Control: Label@2.5.1
                Properties:
                  X: =24
                  Y: =24
                  Width: =320
                  Height: =48
                  Text: ="lblSubProf"
                  Color: =varThemeText
                  Size: =14
            - icoBackProf:
                Control: Classic/Icon@2.5.0
                Properties:
                  X: =24
                  Y: =24
                  Width: =320
                  Height: =48
                  Icon: =Icon.CheckBadge
                  Color: =varThemeText
      - grpProfCard:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            X: =24
            Y: =24
            Width: =320
            Height: =48
            Fill: =RGBA(255, 255, 255, 1)
            BorderThickness: =1
          Children:
            - imgProfAvatar:
                Control: Image@2.2.3
                Properties:
                  X: =24
                  Y: =24
                  Width: =320
                  Height: =48
                  Image: ="logo"
            - lblProfName:
                Control: Label@2.5.1
                Properties:
                  X: =24
                  Y: =24
                  Width: =320
                  Height: =48
                  Text: ="lblProfName"
                  Color: =varThemeText
                  Size: =14
            - lblProfEmail:
                Control: Label@2.5.1
                Properties:
                  X: =24
                  Y: =24
                  Width: =320
                  Height: =48
                  Text: ="lblProfEmail"
                  Color: =varThemeText
                  Size: =14
            - lblProfTeam:
                Control: Label@2.5.1
                Properties:
                  X: =24
                  Y: =24
                  Width: =320
                  Height: =48
                  Text: ="lblProfTeam"
                  Color: =varThemeText
                  Size: =14
            - recProfDivider:
                Control: Rectangle@2.3.0
                Properties:
                  X: =24
                  Y: =24
                  Width: =320
                  Height: =48
                  Fill: =varThemePrimary
      - btnProfSignOut:
          Control: Classic/Button@2.2.0
          Properties:
            X: =24
            Y: =24
            Width: =320
            Height: =48
            Text: ="btnProfSignOut"
            Fill: =varThemePrimary
            OnSelect: =Notify("stub")
