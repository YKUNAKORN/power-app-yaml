<!doctype html>
<!-- Eval fixture: a five-section form inside the app shell, scrolling well past the
     768px viewport. Self-contained: no CDN, no webfont, no image file. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>New Request Form</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", system-ui, sans-serif; background: #f4f4f6;
         width: 1366px; }

  /* --- shell ------------------------------------------------------------- */
  .sidebar { position: absolute; left: 0; top: 0; width: 280px; height: 2032px;
             background: #fff; }
  .logo { height: 32px; margin: 32px 24px 0; font-size: 24px; font-weight: 700;
          color: #007ffa; text-align: center; line-height: 32px; }
  .nav { position: absolute; top: 104px; left: 0; width: 280px; }
  .nav a { display: block; height: 48px; line-height: 48px; padding-left: 56px;
           font-size: 16px; color: #414754; text-decoration: none; position: relative; }
  .nav a .ico { position: absolute; left: 16px; top: 12px; width: 24px; height: 24px;
                border-radius: 6px; background: #c1c6d7; }
  .nav a.active { background: #cce4f6; color: #007ffa; }
  .nav a.active::before { content: ""; position: absolute; left: 0; top: 0;
                          width: 4px; height: 48px; background: #007ffa; }
  .topbar { position: absolute; left: 280px; top: 0; width: 1086px; height: 64px;
            background: #fff; }
  .user { position: absolute; right: 80px; top: 12px; text-align: right; }
  .user .name { font-size: 14px; font-weight: 700; color: #181c23; }
  .user .role { font-size: 12px; color: #414754; }
  .avatar { position: absolute; right: 24px; top: 12px; width: 40px; height: 40px;
            border-radius: 20px; background: #c1c6d7; }

  /* --- page -------------------------------------------------------------- */
  .page { position: absolute; left: 304px; top: 96px; width: 1038px; }
  h1 { font-size: 26px; font-weight: 700; color: #181c23; margin-bottom: 24px; }

  .card { width: 1038px; background: #fff; border: 1px solid #c1c6d7;
          border-radius: 8px; padding: 24px; margin-bottom: 24px; }
  .card > header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .badge { width: 28px; height: 28px; border-radius: 14px; background: #cce4f6;
           color: #007ffa; font-size: 14px; font-weight: 700; text-align: center;
           line-height: 28px; }
  .card h2 { font-size: 16px; font-weight: 700; color: #181c23; }

  .grid { display: flex; flex-wrap: wrap; gap: 24px 32px; }
  .field { width: 479px; }
  label { display: block; font-size: 12px; color: #414754; margin-bottom: 6px; }
  input, select { width: 100%; height: 40px; padding: 0 12px; font-size: 14px;
                  color: #181c23; border: 1px solid #c1c6d7; border-radius: 6px;
                  background: #fff; }
  .note { font-size: 12px; color: #414754; margin-bottom: 16px; }

  .actions { width: 1038px; text-align: right; }
  .actions .saved { float: left; font-size: 12px; color: #414754; line-height: 40px; }
  button { height: 40px; padding: 0 24px; font-size: 14px; border-radius: 6px;
           margin-left: 12px; }
  .ghost   { background: transparent; border: 1px solid #c1c6d7; color: #414754; }
  .primary { background: #007ffa; border: 1px solid #007ffa; color: #fff; }
</style>
</head>
<body>

<nav class="sidebar">
  <div class="logo">Team Portal</div>
  <div class="nav">
    <a href="#home"><span class="ico"></span>Home</a>
    <a href="#templates"><span class="ico"></span>Templates</a>
    <a class="active" href="#new"><span class="ico"></span>New Request</a>
    <a href="#mine"><span class="ico"></span>My Requests</a>
  </div>
</nav>

<header class="topbar">
  <div class="user">
    <div class="name">Alex Taylor</div>
    <div class="role">Administrator</div>
  </div>
  <div class="avatar"></div>
</header>

<main class="page">
  <h1>New Request Form</h1>

  <section class="card">
    <header><span class="badge">1</span><h2>Personal Details</h2></header>
    <div class="grid">
      <div class="field"><label>Full Name</label><input placeholder="Enter full name"></div>
      <div class="field"><label>Email Address</label><input placeholder="name@example.com"></div>
      <div class="field"><label>Country</label><select><option>Select country</option></select></div>
      <div class="field"><label>Phone Number</label><input placeholder="+1 555 000 0000"></div>
    </div>
  </section>

  <section class="card">
    <header><span class="badge">2</span><h2>Request Details</h2></header>
    <div class="grid">
      <div class="field"><label>Request Type</label><input placeholder="e.g. Access request"></div>
      <div class="field"><label>Priority</label><input placeholder="Normal / High"></div>
      <div class="field"><label>Department</label><input placeholder="e.g. Finance"></div>
      <div class="field"><label>Reference No.</label><input placeholder="e.g. REQ-00123"></div>
    </div>
  </section>

  <section class="card">
    <header><span class="badge">3</span><h2>Address</h2></header>
    <div class="grid">
      <div class="field"><label>Street Address</label><input placeholder="e.g. 123 Main St"></div>
      <div class="field"><label>Unit / Apt</label><input placeholder="e.g. Apt 4B"></div>
      <div class="field"><label>Floor / Building</label><input placeholder="e.g. Floor 5"></div>
      <div class="field"><label>Area</label><input placeholder="e.g. Downtown"></div>
      <div class="field"><label>City</label><input placeholder="e.g. Seattle"></div>
      <div class="field"><label>Country / Region</label><select><option>Select country</option></select></div>
      <div class="field"><label>State / Province</label><select><option>Select state</option></select></div>
      <div class="field"><label>Region</label><select><option>Select region</option></select></div>
      <div class="field"><label>Postal Code</label><input placeholder="e.g. 98101"></div>
    </div>
  </section>

  <section class="card">
    <header><span class="badge">4</span><h2>Submitted By</h2></header>
    <div class="grid">
      <div class="field"><label>Your Name</label><input placeholder="Enter your name"></div>
      <div class="field"><label>Team</label><select><option>Select team</option></select></div>
      <div class="field"><label>Employee ID</label><input placeholder="Enter a value"></div>
    </div>
  </section>

  <section class="card">
    <header><span class="badge">5</span><h2>Additional Notes</h2></header>
    <p class="note">You're filling out a new request</p>
    <div class="grid">
      <div class="field"><label>Additional Remarks</label>
        <input placeholder="Add any extra details (optional)"></div>
    </div>
  </section>

  <div class="actions">
    <span class="saved">All changes saved locally</span>
    <button class="ghost">Save as draft</button>
    <button class="primary">Export to PDF</button>
  </div>
</main>

</body>
</html>
