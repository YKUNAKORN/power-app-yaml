# SNIPPET   datatable.pa.yaml
# What      A data table bound to an inline table.
# Control   DataTable   (no @version written -- see below)
# Evidence  UNVERIFIED. Never pasted into Power Apps Studio by this repo.
#           property names: Microsoft's published control reference, mirrored at
#           MicrosoftDocs/powerapps-docs (retrieved 2026-09-11)
#           control id is NOT in Microsoft's 1P control-id enum, though
#           controls.yaml lists DataTable under unattempted_controls.
# Test      Paste this WHOLE file onto a blank screen in Studio (Paste code).
# Bisect    If it fails: delete ONE line below the bisect marker, paste again,
#           repeat. The last line you deleted is the one Studio rejects.
# Record    Put the result in docs/test-plan.md.
#
# No @version is written because this repo has no evidence for one, and an
# invented version is exactly the guess this project exists to prevent. If
# Studio rejects the bare id, insert the control from the Studio toolbar, select
# it, and read the real id off its own code -- that costs one minute and settles
# both the id and the version.
# Which COLUMNS a data table shows is configured in Studio, not (as far as
# this repo knows) by a property in .pa.yaml. If the paste succeeds but the
# table is blank, that is a separate question from whether it pasted.
Screens:
  PasteTest:
    Children:
      - ctlDataTable:  # UNVERIFIED -- control type not paste-tested by this repo
          Control: DataTable
          Properties:
            # -- geometry: confirmed on every control this repo has tested --
            X: =40
            Y: =40
            Width: =560
            Height: =240
            # -- UNVERIFIED below here: delete one line at a time --
            Items: =["Alpha","Bravo","Charlie"]
            NoDataText: ="Nothing to show"
            HeadingFill: =RGBA(244, 244, 246, 1)
            HeadingColor: =RGBA(24, 28, 35, 1)
            HeadingSize: =14
            BorderColor: =RGBA(193, 198, 215, 1)
            BorderThickness: =1
